{% extends "base.html" %}{% block title %}Sign in · ARENA{% endblock %}{% block content %}<div style="max-width:520px;margin:20px auto"><div class="eyebrow">Welcome back</div><h1>Sign in to ARENA</h1><form class="card" method="post" action="{{ url_for('login') }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><div class="field"><label for="identity">Username or email</label><input id="identity" name="identity" value="{{ identity }}" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required></div><button type="submit" style="width:100%">Sign in</button><p class="muted">New to ARENA? <a href="{{ url_for('register') }}">Create an account</a>.</p></form></div>{% endblock %}
