{% extends "base.html" %}{% block title %}Create account · ARENA{% endblock %}{% block content %}<div style="max-width:520px;margin:20px auto"><div class="eyebrow">Join the community</div><h1>Create your account</h1><p class="muted">Your next squad starts here.</p><form class="card" method="post" action="{{ url_for('register') }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><div class="field"><label for="username">Username</label><input id="username" name="username" value="{{ username }}" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" autocomplete="username" required></div><div class="field"><label for="email">Email</label><input id="email" type="email" name="email" value="{{ email }}" maxlength="254" autocomplete="email" required></div><div class="field"><label for="password">Password (at least 10 characters)</label><input id="password" type="password" name="password" minlength="10" autocomplete="new-password" required></div><button type="submit" style="width:100%">Create account</button><p class="muted">Already registered? <a href="{{ url_for('login') }}">Sign in</a>.</p></form></div>{% endblock %}
